<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #1a1a1a; }
      .th  { font-size: 14px; font-weight: 500; }
      .ts  { font-size: 12px; font-weight: 400; fill: #555; }
      .t   { font-size: 14px; font-weight: 400; }
      .box { fill: #f5f5f3; stroke: #ccc; }
    </style>
  </defs>

  <!-- Left panel: 1次独立 -->
  <rect x="20" y="20" width="300" height="260" rx="8" fill="none" stroke="#ccc" stroke-width="0.5"/>
  <text class="th" x="170" y="48" text-anchor="middle">1次独立の例（平面）</text>

  <!-- Axes left -->
  <line x1="60" y1="260" x2="300" y2="260" stroke="#bbb" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="60" y1="260" x2="60" y2="50" stroke="#bbb" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- v1: (3,1) direction -->
  <line x1="60" y1="260" x2="210" y2="210" stroke="#3B8BD4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="th" x="142" y="248" fill="#185FA5">v₁</text>

  <!-- v2: (1,3) direction -->
  <line x1="60" y1="260" x2="100" y2="100" stroke="#1D9E75" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="th" x="65" y="168" fill="#0F6E56">v₂</text>

  <!-- Span area illustration (light parallelogram) -->
  <polygon points="60,260 210,210 250,50 100,100" fill="#3B8BD4" opacity="0.07"/>

  <text class="ts" x="170" y="280" text-anchor="middle">どちらも他方の定数倍でない → 独立</text>

  <!-- Right panel: 1次従属 -->
  <rect x="360" y="20" width="300" height="260" rx="8" fill="none" stroke="#ccc" stroke-width="0.5"/>
  <text class="th" x="510" y="48" text-anchor="middle">1次従属の例（平面）</text>

  <!-- Axes right -->
  <line x1="400" y1="260" x2="640" y2="260" stroke="#bbb" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="260" x2="400" y2="50" stroke="#bbb" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- w1: (2,1) direction -->
  <line x1="400" y1="260" x2="520" y2="200" stroke="#3B8BD4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="th" x="460" y="245" fill="#185FA5">w₁</text>

  <!-- w2: (4,2) direction — exactly 2×w1, so dependent -->
  <line x1="400" y1="260" x2="590" y2="140" stroke="#E24B4A" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <text class="th" x="548" y="215" fill="#A32D2D">w₂ = 2w₁</text>

  <!-- label showing the equation -->
  <rect x="378" y="88" width="254" height="40" rx="6" fill="#f5f5f3" stroke="#ccc" stroke-width="0.5"/>
  <text class="ts" x="505" y="110" text-anchor="middle">2w₁ − w₂ = 0 (c₁,c₂ がゼロでない)</text>

  <text class="ts" x="510" y="280" text-anchor="middle">w₂ は w₁ の定数倍 → 従属</text>
</svg>
