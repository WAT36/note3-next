<svg width="100%" viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>実内積と複素内積の公理比較</title>
  <desc>左：実内積の4公理、右：複素内積の4公理（対称性が共役対称性に変わる）</desc>
  <defs>
    <style>
      text { font-family: sans-serif; fill: #1a1a1a; }
      .th { font-size: 14px; font-weight: 500; }
      .ts { font-size: 12px; font-weight: 400; fill: #555; }
      .fm { font-size: 12px; font-family: Georgia, serif; fill: #1a1a1a; }
    </style>
  </defs>

  <!-- 左：実内積 -->
  <rect x="20" y="20" width="300" height="205" rx="8" fill="none" stroke="#ccc" stroke-width="0.5"/>
  <rect x="20" y="20" width="300" height="34" rx="8" fill="#f5f5f3" stroke="#ccc" stroke-width="0.5"/>
  <rect x="20" y="42" width="300" height="12" fill="#f5f5f3"/>
  <text class="th" x="170" y="42" text-anchor="middle" dominant-baseline="central">実内積（再掲）</text>

  <rect x="32" y="65" width="276" height="22" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="fm" x="170" y="79" text-anchor="middle" fill="#0C447C">(1) 対称性：⟨u, v⟩ = ⟨v, u⟩</text>

  <rect x="32" y="95" width="276" height="22" rx="5" fill="#f5f5f3" stroke="#ccc" stroke-width="0.5"/>
  <text class="fm" x="170" y="109" text-anchor="middle">(2) 線形性（スカラー倍）：⟨cu, v⟩ = c⟨u, v⟩</text>

  <rect x="32" y="125" width="276" height="22" rx="5" fill="#f5f5f3" stroke="#ccc" stroke-width="0.5"/>
  <text class="fm" x="170" y="139" text-anchor="middle">(3) 線形性（加法）：⟨u+v, w⟩ = ⟨u,w⟩+⟨v,w⟩</text>

  <rect x="32" y="155" width="276" height="22" rx="5" fill="#f5f5f3" stroke="#ccc" stroke-width="0.5"/>
  <text class="fm" x="170" y="169" text-anchor="middle">(4) 正定値性：⟨v, v⟩ ≥ 0，= 0 ⟺ v=0</text>

  <text class="ts" x="170" y="207" text-anchor="middle">係数 c は実数</text>

  <!-- 右：複素内積 -->
  <rect x="360" y="20" width="300" height="205" rx="8" fill="none" stroke="#ccc" stroke-width="0.5"/>
  <rect x="360" y="20" width="300" height="34" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <rect x="360" y="42" width="300" height="12" fill="#EEEDFE"/>
  <text class="th" x="510" y="42" text-anchor="middle" dominant-baseline="central" fill="#3C3489">複素内積（新）</text>

  <!-- (1) 変更あり -->
  <rect x="372" y="65" width="276" height="22" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text class="fm" x="510" y="79" text-anchor="middle" fill="#3C3489">(1) 共役対称性：⟨u, v⟩ = ⟨v, u⟩̄</text>

  <rect x="372" y="95" width="276" height="22" rx="5" fill="#f5f5f3" stroke="#ccc" stroke-width="0.5"/>
  <text class="fm" x="510" y="109" text-anchor="middle">(2) 線形性（スカラー倍）：⟨cu, v⟩ = c⟨u, v⟩</text>

  <rect x="372" y="125" width="276" height="22" rx="5" fill="#f5f5f3" stroke="#ccc" stroke-width="0.5"/>
  <text class="fm" x="510" y="139" text-anchor="middle">(3) 線形性（加法）：⟨u+v, w⟩ = ⟨u,w⟩+⟨v,w⟩</text>

  <rect x="372" y="155" width="276" height="22" rx="5" fill="#f5f5f3" stroke="#ccc" stroke-width="0.5"/>
  <text class="fm" x="510" y="169" text-anchor="middle">(4) 正定値性：⟨v, v⟩ ≥ 0，= 0 ⟺ v=0</text>

  <text class="ts" x="510" y="207" text-anchor="middle">係数 c は複素数　／　⟨v, v⟩ ∈ ℝ は(1)より保証</text>
</svg>
