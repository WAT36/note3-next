<svg width="100%" viewBox="0 0 680 255" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>直交行列と内積の保存</title>
  <desc>左：内積の不変性の図解、右：直交行列による基底の変換と内積の関係のまとめ</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #1a1a1a; }
      .th { font-size: 14px; font-weight: 500; }
      .ts { font-size: 12px; font-weight: 400; fill: #555; }
      .fm { font-size: 12px; font-family: Georgia, serif; fill: #1a1a1a; }
    </style>
  </defs>

  <!-- 左パネル：内積の保存 -->
  <rect x="20" y="20" width="300" height="220" rx="8" fill="none" stroke="#ccc" stroke-width="0.5"/>
  <text class="th" x="170" y="46" text-anchor="middle">直交変換と内積の保存</text>

  <!-- 変換前 -->
  <rect x="32" y="60" width="118" height="80" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="91" y="84" text-anchor="middle" fill="#0C447C">𝒖, 𝒗 ∈ ℝⁿ</text>
  <text class="fm" x="91" y="106" text-anchor="middle" fill="#185FA5">⟨𝒖, 𝒗⟩</text>
  <text class="fm" x="91" y="124" text-anchor="middle" fill="#185FA5">‖𝒖‖, ‖𝒗‖</text>

  <!-- 矢印（Q をかける） -->
  <line x1="150" y1="100" x2="208" y2="100" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="179" y="93" text-anchor="middle" fill="#534AB7">× Q</text>

  <!-- 変換後 -->
  <rect x="210" y="60" width="118" height="80" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="th" x="269" y="84" text-anchor="middle" fill="#085041">Q𝒖, Q𝒗</text>
  <text class="fm" x="269" y="106" text-anchor="middle" fill="#0F6E56">⟨Q𝒖, Q𝒗⟩</text>
  <text class="fm" x="269" y="124" text-anchor="middle" fill="#0F6E56">‖Q𝒖‖, ‖Q𝒗‖</text>

  <!-- 等号の説明 -->
  <rect x="32" y="152" width="284" height="22" rx="5" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="fm" x="174" y="167" text-anchor="middle" fill="#085041">⟨Q𝒖, Q𝒗⟩ = ⟨𝒖, 𝒗⟩ （内積が不変）</text>
  <rect x="32" y="180" width="284" height="22" rx="5" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="fm" x="174" y="195" text-anchor="middle" fill="#085041">‖Q𝒗‖ = ‖𝒗‖ （ノルムが不変）</text>
  <rect x="32" y="208" width="284" height="22" rx="5" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="fm" x="174" y="223" text-anchor="middle" fill="#085041">cos θ' = cos θ （角度が不変）</text>

  <!-- 右パネル：同値条件まとめ -->
  <rect x="360" y="20" width="300" height="220" rx="8" fill="none" stroke="#ccc" stroke-width="0.5"/>
  <text class="th" x="510" y="46" text-anchor="middle">直交行列の同値条件</text>

  <rect x="372" y="62" width="276" height="28" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="fm" x="510" y="80" text-anchor="middle" fill="#3C3489">QᵀQ = I　（列が正規直交）</text>

  <text class="ts" x="510" y="102" text-anchor="middle">⟺</text>

  <rect x="372" y="108" width="276" height="28" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="fm" x="510" y="126" text-anchor="middle" fill="#3C3489">QQᵀ = I　（行が正規直交）</text>

  <text class="ts" x="510" y="148" text-anchor="middle">⟺</text>

  <rect x="372" y="154" width="276" height="28" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="fm" x="510" y="172" text-anchor="middle" fill="#3C3489">Qᵀ = Q⁻¹　（逆行列が転置）</text>

  <text class="ts" x="510" y="196" text-anchor="middle">⟺</text>

  <rect x="372" y="200" width="276" height="28" rx="5" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="fm" x="510" y="218" text-anchor="middle" fill="#085041">⟨Q𝒖, Q𝒗⟩ = ⟨𝒖, 𝒗⟩ （内積保存）</text>
</svg>
