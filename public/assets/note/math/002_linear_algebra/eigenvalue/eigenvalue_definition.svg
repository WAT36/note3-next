<svg width="100%" viewBox="0 0 680 265" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>固有値・固有ベクトルの幾何的意味</title>
  <desc>左：一般の変換（方向が変わる）、右：固有ベクトル（方向が不変、スカラー倍のみ）</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #1a1a1a; }
      .th { font-size: 14px; font-weight: 500; }
      .ts { font-size: 12px; font-weight: 400; fill: #555; }
      .fm { font-size: 12px; font-family: Georgia, serif; fill: #1a1a1a; }
    </style>
  </defs>

  <!-- 左パネル：一般のベクトル（方向が変わる） -->
  <rect x="20" y="20" width="300" height="230" rx="8" fill="none" stroke="#ccc" stroke-width="0.5"/>
  <text class="th" x="170" y="46" text-anchor="middle">一般のベクトル：方向が変わる</text>

  <line x1="45" y1="185" x2="295" y2="185" stroke="#bbb" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="80" y1="215" x2="80" y2="55" stroke="#bbb" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- v（変換前） -->
  <line x1="80" y1="185" x2="210" y2="115" stroke="#888" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text class="th" x="160" y="138" fill="#555">𝒗</text>

  <!-- Av（変換後、方向が変わる） -->
  <line x1="80" y1="185" x2="175" y2="80" stroke="#3B8BD4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="th" x="180" y="80" fill="#185FA5">A𝒗</text>

  <rect x="28" y="218" width="284" height="22" rx="5" fill="#f5f5f3" stroke="#ccc" stroke-width="0.5"/>
  <text class="fm" x="170" y="233" text-anchor="middle">A𝒗 ≠ λ𝒗　（方向が変化）</text>

  <!-- 右パネル：固有ベクトル（方向が変わらない） -->
  <rect x="360" y="20" width="300" height="230" rx="8" fill="none" stroke="#ccc" stroke-width="0.5"/>
  <text class="th" x="510" y="46" text-anchor="middle">固有ベクトル：方向が変わらない</text>

  <line x1="385" y1="185" x2="635" y2="185" stroke="#bbb" stroke-width="0.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="215" x2="420" y2="55" stroke="#bbb" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- v（固有ベクトル、変換前） -->
  <line x1="420" y1="185" x2="510" y2="140" stroke="#888" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text class="th" x="512" y="140" fill="#555">𝒗</text>

  <!-- Av = λv（方向が同じ、長さが変わる） -->
  <line x1="420" y1="185" x2="600" y2="95" stroke="#1D9E75" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="th" x="596" y="90" fill="#0F6E56">A𝒗 = λ𝒗</text>

  <!-- 同じ方向を示す補助線 -->
  <line x1="420" y1="185" x2="630" y2="80" stroke="#ccc" stroke-width="0.8" stroke-dasharray="2 4"/>

  <!-- λ > 1 のときスケールアップ -->
  <text class="ts" x="510" y="175" text-anchor="middle" fill="#0F6E56">（λ = 2 のとき 2倍に伸びる）</text>

  <rect x="368" y="218" width="284" height="22" rx="5" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="fm" x="510" y="233" text-anchor="middle" fill="#085041">A𝒗 = λ𝒗　（方向不変、大きさのみ変化）</text>
</svg>
